<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Primary Title & SEO Meta Tags -->
    <title>Fervox AI</title>
    <meta name="description" content="Install and access Fervox AI on your device.">
    
    <!-- Canonical Link (Update 'your-username' to your actual GitHub username) -->
    <link rel="canonical" href="https://your-username.github.io/Fervox-ai/">

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" href="/Fervox-ai/icon.png">
    <link rel="shortcut icon" href="/Fervox-ai/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="/Fervox-ai/icon.png">
    <link rel="manifest" href="/Fervox-ai/manifest.json">

    <!-- Open Graph Metadata (Facebook, LinkedIn, Discord) -->
    <meta property="og:site_name" content="Fervox AI">
    <meta property="og:title" content="Fervox AI">
    <meta property="og:description" content="Install and access Fervox AI on your device.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-username.github.io/Fervox-ai/">
    <meta property="og:image" content="https://your-username.github.io/Fervox-ai/icon.png">

    <!-- Schema.org WebSite Structured Data (Fixes Site Name in Google Search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Fervox AI",
      "alternateName": ["FervoxAI", "Fervox"],
      "url": "https://your-username.github.io/Fervox-ai/"
    }
    </script>

    <!-- Schema.org Organization Structured Data (Reinforces Logo & Brand) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fervox AI",
      "url": "https://your-username.github.io/Fervox-ai/",
      "logo": "https://your-username.github.io/Fervox-ai/icon.png"
    }
    </script>

    <!-- Service Worker Bootstrapper -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/Fervox-ai/sw.js', { scope: '/Fervox-ai/' })
                    .then(reg => console.log('SW Registered:', reg.scope))
                    .catch(err => console.log('SW Failed:', err));
            });
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .app-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Floating Interface Overlays */
        #installBanner {
            display: none; 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 9999; 
            background: #1e1e2e; 
            color: #fff; 
            padding: 12px 20px; 
            border-radius: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            align-items: center; 
            gap: 12px;
        }
        #pwaInstallBtn {
            background: #4f46e5; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            cursor: pointer;
        }
        #pwa-download-circle {
            display: none; 
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background-color: #8A2BE2;
            color: white;
            border: none;
            border-radius: 50% 0 0 50%;
            cursor: pointer;
            box-shadow: -2px 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Main Workspace App Framework -->
    <div class="app-container">
        <iframe src="https://fervox-ai.ai.studio"></iframe>
    </div>

    <!-- Floating PWA Install Sidebar Circle -->
    <button id="pwa-download-circle" title="Install App">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </button>

    <!-- The Single Link to your Script Logic -->
    <script src="app.js"></script>
</body>
</html>
