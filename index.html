<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fervox AI</title>

    <!-- Corrected Absolute Paths for Fervox-ai Repository -->
    <link rel="manifest" href="/Fervox-ai/manifest.json">
    <link rel="icon" type="image/png" href="/Fervox-ai/icon.png">
    <link rel="apple-touch-icon" href="/Fervox-ai/icon.png">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/Fervox-ai/sw.js', { scope: '/Fervox-ai/' })
                    .then(reg => console.log('SW Registered:', reg.scope))
                    .catch(err => console.log('SW Failed:', err));
            });
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Embedded Live Application -->
    <iframe src="https://fervox-ai.ai.studio"></iframe>
<!-- Custom Install Banner Container -->
<div id="installBanner" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; background: #1e1e2e; color: #fff; padding: 12px 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-family: sans-serif; align-items: center; gap: 12px;">
  <span>📲 Install <b>Fervox AI</b> on your device!</span>
  <button id="pwaInstallBtn" style="background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;">Install</button>
</div>

<script>
  let deferredPrompt;
  const banner = document.getElementById('installBanner');
  const installBtn = document.getElementById('pwaInstallBtn');

  // Intercept Chrome/Edge native install event
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    // Show custom install prompt banner
    banner.style.display = 'flex';
  });

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        console.log('User installed Fervox AI');
      }
      deferredPrompt = null;
      banner.style.display = 'none';
    }
  });

  // Hide banner if app is already installed
  window.addEventListener('appinstalled', () => {
    banner.style.display = 'none';
    console.log('Fervox AI installed successfully!');
  });
</script>
    <!-- Floating Purple Install Button -->
    <button id="pwa-download-circle" title="Install App" style="
      display: none; /* hidden by default, shown via app.js */
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background-color: #8A2BE2; /* Purple */
      color: white;
      border: none;
      border-radius: 50% 0 0 50%;
      cursor: pointer;
      box-shadow: -2px 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    ">
      <!-- Download Icon -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </button>

    <!-- Connect your new app.js file -->
    <script src="app.js"></script>
</body>
</html>
</body>
</html>
